{% extends 'base.html' %}
{% load static %}

{% block stylesheet%}<link rel="stylesheet" href="{% static 'css/login.css' %}"/>{% endblock %}

{% block content %}
        <main id="login-main" class="login-container">
            <div class="login-card">
            <img src="{% static 'images/logo.png' %}" alt="ReadLi Logo" class="login-logo">
            <h1 class="login-title">Welcome back</h1>
            <p class="login-subtitle">Sign in to your ReadLi account</p>
            <form action="{% url 'login' %}" method="post" class="login-form">
                {% csrf_token %}
                <div class="form-group">
                <label for="username" class="form-label">Username:</label>
                <input type="text" id="username" name="username" class="form-input" required>
                </div>
                <div class="form-group">
                <label for="password" class="form-label">Password:</label>
                <input type="password" id="password" name="password" class="form-input" required>
                </div>
                <button type="submit" class="btn-login">Login</button>
            </form>
            <p class="login-signup-prompt">Don't have an account? <a href="{% url 'signup' %}" class="signup-link">Sign up</a></p>
            </div>
        </main>
{% endblock %}
